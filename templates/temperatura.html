{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-info text-dark fw-bold">Conversor de Temperatura</div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('temperatura') }}">
                    <div class="mb-3">
                        <label for="celsius" class="form-label">Temperatura en grados Celsius (&deg;C)</label>
                        <input type="number" step="0.01" class="form-control" id="celsius" name="celsius" value="{{ resultado.celsius if resultado else '' }}" required>
                    </div>
                    <button type="submit" class="btn btn-info w-100 fw-bold">Convertir Temperatura</button>
                </form>

                {% if resultado %}
                <hr>
                <div class="alert alert-info mb-0">
                    <h5 class="alert-heading">Equivalencias Térmicas</h5>
                    <ul class="list-unstyled mb-0">
                        <li><strong>Dato capturado:</strong> {{ resultado.celsius }} &deg;C</li>
                        <li class="fs-5 mt-1"><strong>Fahrenheit:</strong> {{ resultado.fahrenheit }} &deg;F</li>
                        <li class="fs-5"><strong>Kelvin:</strong> {{ resultado.kelvin }} K</li>
                    </ul>
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
